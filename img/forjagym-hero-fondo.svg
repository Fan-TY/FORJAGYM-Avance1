<svg width="1600" height="420" viewBox="0 0 1600 420" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6efd"/>
      <stop offset="100%" stop-color="#0a58ca"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="420" fill="url(#base)"/>

  <!-- líneas diagonales sutiles -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="40">
    <line x1="-100" y1="500" x2="500" y2="-100"/>
    <line x1="100" y1="500" x2="700" y2="-100"/>
    <line x1="300" y1="500" x2="900" y2="-100"/>
  </g>

  <!-- círculos grandes decorativos -->
  <circle cx="1420" cy="90" r="180" fill="#ffffff" opacity="0.06"/>
  <circle cx="1300" cy="330" r="110" fill="#ffffff" opacity="0.05"/>
  <circle cx="1520" cy="300" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="120" cy="60" r="70" fill="#ffffff" opacity="0.05"/>

  <!-- anillos tipo "resultados medibles" -->
  <circle cx="1470" cy="150" r="45" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4"/>
  <circle cx="1470" cy="150" r="26" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4"/>

  <!-- mancuernas simplificadas, esparcidas y muy tenues -->
  <g fill="#ffffff" opacity="0.10">
    <g transform="translate(1220,260) rotate(-20)">
      <rect x="0" y="18" width="90" height="10" rx="3"/>
      <rect x="-14" y="6" width="16" height="34" rx="4"/>
      <rect x="88" y="6" width="16" height="34" rx="4"/>
    </g>
    <g transform="translate(1380,60) rotate(15)">
      <rect x="0" y="12" width="60" height="7" rx="3"/>
      <rect x="-10" y="4" width="11" height="23" rx="3"/>
      <rect x="59" y="4" width="11" height="23" rx="3"/>
    </g>
  </g>
</svg>
