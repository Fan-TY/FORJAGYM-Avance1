<!doctype html>
    <html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>ForjaGYM</title>
</head>

<body class="d-flex flex-column min-vh-100">


    <main class="flex-grow-1 d-flex align-items-center bg-primary-subtle">
        <div class="container">
            <div class="mb-2 mt-1">
                <a href="#" class="navbar-brand d-flex align-items-center">
                    <img src="/img/forjagym_icono.png" alt="" class="img-fluid" style="max-width: 50px;"> 
                    <p class="mb-0 ms-2 fw-bold fs-2">ForjaGYM</p>
                </a>
            </div>

            <div class="row g-4 align-items-center mb-3">
                <div class="col-md-6  m-auto">
                    <div class="card bg-transparent border-0 ">
                        
                        <div class="card-body">  
                            <span class="badge bg-primary bg-opacity-10 text-primary mb-3 mt-3">
                                <i class="fa-solid fa-bolt"></i> Zona de Socios   
                            </span>

                            <h3 class="card-title">Entrena sin límites</h3>
                            <p class="mb-4">accede a tus planes, promociones y pagos en un solo lugar</p>

                            <div class="d-flex align-items-center ms-5">
                                <i class="fa-solid fa-headset fs-3  bg-primary bg-opacity-10 text-primary p-2 rounded-3"></i>
                                <p class="mb-0 ms-3">
                                    <strong>Atención 24/7</strong><br>
                                    Siempre disponible para ti
                                </p>
                            </div>

                            <div class="d-flex align-items-center mt-3 ms-5">
                                <i class="fa-regular fa-credit-card fs-3 bg-primary bg-opacity-10 text-primary p-2 rounded-3"></i>
                                <p class="mb-0 ms-3">
                                    <Strong>Pagos Digitales</Strong><br> 
                                    Paga desde donde estés
                                </p>
                            </div>

                            <div class="d-flex align-items-center mt-3 ms-5">
                                <i class="fa-solid fa-shield-heart fs-3 bg-primary bg-opacity-10 text-primary p-2 rounded-3"></i>
                                <p class="mb-0 ms-3">
                                    <strong>Ambiente Seguro</strong><br>
                                    Espacios cuidados para ti</p>
                            </div>

                        </div>
                    </div>
                </div>

                <div class="col-md-6 mb-2">
                    <div class="card rounded-5  border-primary-subtle border-2 bg-primary bg-opacity-10">
                        <div class="card-body p-4">
                            <h3 class="card-title">Iniciar Sesión</h3>
                            <p>Bienvenido de nuevo,socio :)</p>
                            
                            <form action="">
                                <div class="form-group">
                                    <label for="correo" class="mb-2">Correo de usuario</label>
                                    <input type="email" placeholder="correo@gmail.com" class="form-control mb-4 bg-body-tertiary">

                                    <label for="contraseña" class="mb-2">Contraseña de usuario</label>
                                    <input type="password" placeholder="*******" class="form-control mb-4 bg-body-tertiary">

                                    <button type="button" class="btn btn-primary w-100" onclick="window.location.href='/client/Inicio.html'">Ingresar</button>
                                    
                                </div>
                            </form>
                        </div>

                    </div>
                </div>
            </div>
            
        </div>
    </main>
</body>

</html>
